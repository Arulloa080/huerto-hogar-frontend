<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Huerto Hogar Admin</title>
    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS del grupo-->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-success d-md-none p-3 shadow-sm">
        <a class="navbar-brand fw-bold" href="admin-home.html">HuertoHogar Admin</a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Menú -->
            <nav class="navbar navbar-expand-lg navbar-dark navbar-green shadow-sm">
                <div class="container">
                    <a class="navbar-brand d-flex align-items-center gap-2 brand-text" href="admin-home.html">
                        <img src="img/logo.png" alt="Logo HuertoHogar" class="logo-img">
                        <span>HuertoHogar Admin</span>
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarAdmin">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarAdmin">
                        <ul class="navbar-nav me-auto">
                            <li class="nav-item"><a class="nav-link" href="admin-home.html">Inicio</a></li>
                            <li class="nav-item"><a class="nav-link" href="admin-productos.html">Productos</a></li>
                            <li class="nav-item"><a class="nav-link active" href="admin-usuarios.html">Usuarios</a></li>
                            <li class="nav-item"><a class="nav-link" href="mensajes.html">Mensajes</a></li>
                        </ul>
                        <div class="d-flex gap-2">
                            <a href="index.html" class="btn btn-yellow d-flex align-items-center gap-2 fw-bold">
                                <span>Ir a la Tienda</span>
                            </a>
                            <a href="index.html" class="btn btn-outline-light d-flex align-items-center gap-2">
                                <span>Cerrar Sesión</span>
                            </a>
                        </div>
                    </div>
                </div>
        </nav>
            
        
        <!-- codigo principal -->


            <main class="container py-5">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Gestión de Usuarios</h1>
                    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalUsuario">
                        + Agregar Nuevo Usuario
                    </button>
                </div>

                <!-- Tabla que contiene a los usuarios -->
                <section class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>RUT</th>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Rol</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTablaUsuarios">
                            <!--Los datos fijos se borraron, el js inyectara las filas-->
                        </tbody>
                    </table>
                </section>
            </main>
        </div>
    </div>

    <!-- formulario para crear o editar usuarios -->
    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="modalUsuarioLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="modalUsuarioLabel">Registrar Nuevo Usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formUsuario">
                        <div class="row g-3">
                            <!-- RUT -->
                            <div class="col-md-6">
                                <label for="rut" class="form-label">RUT *</label>
                                <input type="text" class="form-control" id="rut" name="rut" placeholder="12345678-9" required>
                                <div class="invalid-feedback">Ingrese un RUT válido (Módulo 11).</div>
                            </div>
                            
                            <!-- Tipo de Usuario -->
                            <div class="col-md-6">
                                <label for="tipoUsuario" class="form-label">Tipo de Usuario *</label>
                                <select class="form-select" id="tipoUsuario" name="tipoUsuario" required>
                                    <option value="">Seleccione una opción</option>
                                    <option value="Administrador">Administrador</option>
                                    <option value="Vendedor">Vendedor</option>
                                    <option value="Cliente">Cliente</option>
                                </select>
                            </div>

                            <!-- Nombre -->
                            <div class="col-md-6">
                                <label for="nombre" class="form-label">Nombre *</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" maxlength="50" required>
                            </div>

                            <!-- Apellidos -->
                            <div class="col-md-6">
                                <label for="apellidos" class="form-label">Apellidos *</label>
                                <input type="text" class="form-control" id="apellidos" name="apellidos" maxlength="100" required>
                            </div>

                            <!-- Correo -->
                            <div class="col-md-12">
                                <label for="correo" class="form-label">Correo Electrónico *</label>
                                <input type="email" class="form-control" id="correo" name="correo" maxlength="100" required>
                                <div class="invalid-feedback">Ingrese un correo válido.</div>
                            </div>

                            <!-- Fecha nacimiento -->
                            <div class="col-md-6">
                                <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento">
                            </div>

                            <!-- Region -->
                            <div class="col-md-6">
                                <label for="region" class="form-label">Región *</label>
                                <select class="form-select" id="region" name="region" required>
                                    <option value="">Seleccione Región</option>
                                    <!-- Se llenará con Js -->
                                </select>
                            </div>

                            <!-- Comuna -->
                            <div class="col-md-12">
                                <label for="comuna" class="form-label">Comuna *</label>
                                <select class="form-select" id="comuna" name="comuna" required disabled>
                                    <option value="">Seleccione primero una región</option>
                                    <!-- Se llenará con Js -->
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="formUsuario" class="btn btn-success">Guardar Usuario</button>
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/regiones-comunas.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/admin-usuarios.js"></script>
</body>
</html>
