<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Huerto Hogar Admin</title>
    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS del grupo-->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <!-- menu vertical-->
            <nav class="col-md-3 col-lg-2 d-md-block bg-success sidebar collapse" style="min-height: 100vh;">
                <div class="position-sticky pt-3">
                    <h4 class="text-white text-center mb-4"> Huerto Hogar Admin</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="admin-home.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="admin-productos.html">Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active text-white fw-bold" href="admin-usuarios.html">Usuarios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="contacto.html">Mensajes</a>
                        </li>
                        <li class="nav-item mt-4">
                            <a class="nav-link text-danger" href="index.html">Cerrar Sesión</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- codigo principal -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Gestión de Usuarios</h1>
                    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalUsuario">
                        + Agregar Nuevo Usuario
                    </button>
                </div>

                <!-- Tabla que contiene a los usuarios -->
                <section class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>RUT</th>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Rol</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaUsuarios">
                            <!-- Ejemplo estático (Eliminar esta fila estática cuando se cree el Js) -->
                            <tr>
                                <td>12.345.678-9</td>
                                <td>Sofía Catalán</td>
                                <td>sofia@duoc.cl</td>
                                <td><span class="badge bg-primary">Administrador</span></td>
                                <td>
                                    <button class="btn btn-sm btn-warning">Editar</button>
                                    <button class="btn btn-sm btn-danger">Eliminar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </main>
        </div>
    </div>

    <!-- formulario para crear o editar usuarios -->
    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="modalUsuarioLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="modalUsuarioLabel">Registrar Nuevo Usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formUsuario">
                        <div class="row g-3">
                            <!-- RUT -->
                            <div class="col-md-6">
                                <label for="rut" class="form-label">RUT *</label>
                                <input type="text" class="form-control" id="rut" name="rut" placeholder="12345678-9" required>
                                <div class="invalid-feedback">Ingrese un RUT válido (Módulo 11).</div>
                            </div>
                            
                            <!-- Tipo de Usuario -->
                            <div class="col-md-6">
                                <label for="tipoUsuario" class="form-label">Tipo de Usuario *</label>
                                <select class="form-select" id="tipoUsuario" name="tipoUsuario" required>
                                    <option value="">Seleccione una opción</option>
                                    <option value="Administrador">Administrador</option>
                                    <option value="Vendedor">Vendedor</option>
                                    <option value="Cliente">Cliente</option>
                                </select>
                            </div>

                            <!-- Nombre -->
                            <div class="col-md-6">
                                <label for="nombre" class="form-label">Nombre *</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" maxlength="50" required>
                            </div>

                            <!-- Apellidos -->
                            <div class="col-md-6">
                                <label for="apellidos" class="form-label">Apellidos *</label>
                                <input type="text" class="form-control" id="apellidos" name="apellidos" maxlength="100" required>
                            </div>

                            <!-- Correo -->
                            <div class="col-md-12">
                                <label for="correo" class="form-label">Correo Electrónico *</label>
                                <input type="email" class="form-control" id="correo" name="correo" maxlength="100" required>
                                <div class="invalid-feedback">Ingrese un correo válido.</div>
                            </div>

                            <!-- Fecha nacimiento -->
                            <div class="col-md-6">
                                <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento">
                            </div>

                            <!-- Region -->
                            <div class="col-md-6">
                                <label for="region" class="form-label">Región *</label>
                                <select class="form-select" id="region" name="region" required>
                                    <option value="">Seleccione Región</option>
                                    <!-- Se llenará con Js -->
                                </select>
                            </div>

                            <!-- Comuna -->
                            <div class="col-md-12">
                                <label for="comuna" class="form-label">Comuna *</label>
                                <select class="form-select" id="comuna" name="comuna" required disabled>
                                    <option value="">Seleccione primero una región</option>
                                    <!-- Se llenará con Js -->
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="formUsuario" class="btn btn-success">Guardar Usuario</button>
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Aquí va nuestro script de validación más adelante -->
    <!-- <script src="js/validaciones.js"></script> -->
</body>
</html>
