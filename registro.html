</head>

        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="img/logo.png" alt="Logo HuertoHogar" class="logo-img" width="30" height="30">
                <span class="text-white fw-bold">HuertoHogar</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto align-items-center">
                    <li class="nav-item"><a class="nav-link text-white" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="carrito.html">Tienda / Carrito</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="nosotros.html">Nosotros</a></li>
                    
                    <!-- Enlaces en blanco. 'Registro' está subrayado y activo -->
                    <li class="nav-item"><a class="nav-link fw-bold text-white" href="login.html">Iniciar Sesión</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-white text-decoration-underline active" href="registro.html">Registro</a></li>
                    <li class="nav-item"><a class="nav-link text-danger fw-bold" href="admin-home.html">Panel Admin</a></li>
                </ul>
                
                <!-- Botón del Carrito -->
                <a href="carrito.html" class="btn btn-yellow position-relative d-flex align-items-center gap-2 font-weight-bold ms-lg-3 mt-3 mt-lg-0">
                    <span>🛒 Carrito</span>
                    <span id="cart-count-badge" class="badge bg-danger rounded-pill">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="container mt-5 mb-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Crea tu Cuenta</h2>
                        
                        <form id="formRegistro">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="runReg" class="form-label">RUN (Sin puntos ni guion): <span class="text-danger">*</span></label>
                                    <input type="text" id="runReg" class="form-control" placeholder="Ej: 19011022K" maxlength="9" required>
                                    <span id="errorRunReg" class="text-danger small"></span>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="correoReg" class="form-label">Correo Electrónico: <span class="text-danger">*</span></label>
                                    <input type="email" id="correoReg" class="form-control" placeholder="ejemplo@duoc.cl" maxlength="100" required>
                                    <span id="errorCorreoReg" class="text-danger small"></span>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nombreReg" class="form-label">Nombre: <span class="text-danger">*</span></label>
                                    <input type="text" id="nombreReg" class="form-control" maxlength="50" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="apellidoReg" class="form-label">Apellidos: <span class="text-danger">*</span></label>
                                    <input type="text" id="apellidoReg" class="form-control" maxlength="100" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="passReg" class="form-label">Contraseña: <span class="text-danger">*</span></label>
                                    <input type="password" id="passReg" class="form-control" placeholder="Entre 4 y 10 caracteres" maxlength="10" required>
                                    <span id="errorPassReg" class="text-danger small"></span>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="fechaNacReg" class="form-label">Fecha de Nacimiento: (Opcional)</label>
                                    <input type="date" id="fechaNacReg" class="form-control">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="regionReg" class="form-label">Región: <span class="text-danger">*</span></label>
                                    <select id="regionReg" class="form-select" required>
                                        <option value="">Seleccione Región...</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="comunaReg" class="form-label">Comuna: <span class="text-danger">*</span></label>
                                    <select id="comunaReg" class="form-select" required>
                                        <option value="">Seleccione Comuna...</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="direccionReg" class="form-label">Dirección: <span class="text-danger">*</span></label>
                                <input type="text" id="direccionReg" class="form-control" maxlength="300" required>
                            </div>
                            
                            <div class="d-grid gap-2 mt-4">
                                <button type="button" id="btnRegistro" class="btn btn-success" disabled>Registrarse</button>
                            </div>
                        </form>
                    </div>
                    <p class="text-center mt-3 text-muted">¿Ya eres parte de Huerto Hogar? <a href="login.html" class="text-success text-decoration-none fw-bold">Inicia sesión aquí</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center mt-auto py-4 bg-dark text-white">
        <p class="mb-1">🌱 <strong>HuertoHogar</strong> - Productos agrícolas directo a tu mesa</p>
        <small>&copy; 2026 Todos los derechos reservados.</small>
    </footer>

    <script src="js/cart-badge.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
