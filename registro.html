<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerto Hogar</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="blogs.html">Nuestro Blog</a>
            <a href="login.html">Iniciar Sesión</a>
            <a href="registro.html">Regístrate</a>
        </nav>
    </header>

    <main>
        <section class="contenedor-formulario">
            <h2>Crea tu cuenta en Huerto Hogar</h2>
            <form id="formRegistro">
                
                <div class="grupo-input">
                    <label for="runReg">RUN (Sin puntos ni guion):</label>
                    <input type="text" id="runReg" autocomplete="off" placeholder="19011022K" required>
                </div>

                <div class="grupo-input">
                    <label for="nombreReg">Nombres:</label>
                    <input type="text" id="nombreReg" autocomplete="given-name" maxlength="50" required>
                </div>

                <div class="grupo-input">
                    <label for="apellidoReg">Apellidos:</label>
                    <input type="text" id="apellidoReg" autocomplete="family-name" maxlength="100" required>
                </div>

                <div class="grupo-input">
                    <label for="fechaNacReg">Fecha de Nacimiento:</label>
                    <input type="date" id="fechaNacReg" autocomplete="bday">
                </div>

                <div class="grupo-input">
                    <label for="correoReg">Correo Institucional o Gmail:</label>
                    <input type="email" id="correoReg" autocomplete="email" maxlength="100" required>
                    <span id="errorCorreoReg" style="color: red; font-size: 0.8em; display: block;"></span>
                </div>

                <div class="grupo-input">
                    <label for="regionReg">Región:</label>
                    <select id="regionReg" required>
                        <option value="">Seleccione una región...</option>
                    </select>
                </div>

                <div class="grupo-input">
                    <label for="comunaReg">Comuna:</label>
                    <select id="comunaReg" required>
                        <option value="">Seleccione una comuna...</option>
                    </select>
                </div>

                <div class="grupo-input">
                    <label for="direccionReg">Dirección:</label>
                    <input type="text" id="direccionReg" autocomplete="street-address" maxlength="300" required>
                </div>

                <div class="grupo-input">
                    <label for="passReg">Contraseña:</label>
                    <input type="password" id="passReg" autocomplete="new-password" placeholder="Entre 4 y 10 caracteres" required>
                    <span id="errorPassReg" style="color: red; font-size: 0.8em; display: block;"></span>
                </div>

                <button type="submit" id="btnRegistro" disabled>Registrarse</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Huerto Hogar - Conectando familias con el campo chileno de forma sostenible.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
