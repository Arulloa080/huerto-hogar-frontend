<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Huerto Hogar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="blogs.html">Nuestro Blog</a>
            <a href="login.html">Iniciar Sesión</a>
            <a href="registro.html">Regístrate</a>
        </nav>
    </header>

    <main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4">Crea tu Cuenta</h2>
                    
                    <form id="formRegistro">
                        <!-- Campo de Correo -->
                        <div class="mb-3">
                            <label for="correoReg" class="form-label">Correo Electrónico:</label>
                            <input type="email" id="correoReg" class="form-control" placeholder="ejemplo@duoc.cl">
                            <span id="errorCorreoReg" class="mensaje-error"></span>
                        </div>
                        
                        <div class="mb-3">
                            <label for="passReg" class="form-label">Contraseña:</label>
                            <input type="password" id="passReg" class="form-control" placeholder="Entre 4 y 10 caracteres">
                            <span id="errorPassReg" class="mensaje-error"></span>
                        </div>
                        
                        <div class="d-grid gap-2 mt-4">
                            <button type="button" id="btnRegistro" class="btn btn-success" disabled>Registrarse</button>
                        </div>
                    </form>

                </div>
            </div>
            <p class="text-center mt-3 text-muted">¿Ya eres parte de Huerto Hogar? <a href="login.html" class="text-success text-decoration-none fw-bold">Inicia sesión aquí</a></p>
        </div>
    </div>
</main>

    <footer>
        <p>Huerto Hogar - Conectando familias con el campo chileno de forma sostenible.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
