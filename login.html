<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Huerto Hogar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg bg-custom-green shadow-sm">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="img/logo.png" alt="Logo HuertoHogar" class="logo-img me-2" width="30" height="30">
                    <span class="text-white" style="color: white !important;">HuertoHogar</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item"><a class="nav-link text-white" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="carrito.html">Tienda / Carrito</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="blogs.html">Blogs</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link fw-bold text-white text-decoration-underline" href="login.html">Iniciar Sesión</a></li>
                        <li class="nav-item"><a class="nav-link fw-bold text-white" href="registro.html">Regístrate</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Bienvenido a Huerto Hogar</h2>
                        
                        <form id="formLogin">
                            <div class="mb-3">
                                <label for="correoLogin" class="form-label">Correo Electrónico:</label>
                                <input type="email" id="correoLogin" class="form-control" placeholder="ejemplo@duoc.cl" autocomplete="username">
                                <span id="errorCorreoLogin" class="mensaje-error"></span>
                            </div>
                            
                            <div class="mb-3">
                                <label for="passLogin" class="form-label">Contraseña:</label>
                                <input type="password" id="passLogin" class="form-control" placeholder="Entre 4 y 10 caracteres" autocomplete="current-password">
                                <span id="errorPassLogin" class="mensaje-error"></span>
                            </div>
                            
                            <div class="d-grid gap-2 mt-4">
                                <button type="button" id="btnLogin" class="btn btn-success" disabled>Ingresar</button>
                            </div>
                        </form>
                    </div>
                    <p class="text-center mt-3 text-muted">¿Aún no tienes cuenta? <a href="registro.html" class="text-success text-decoration-none fw-bold">Regístrate aquí</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center mt-auto py-4">
        <p class="text-muted mb-0 fw-semibold">Huerto Hogar - Conectando familias con el campo chileno de forma sostenible.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
