<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Huerto Hogar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="blogs.html">Nuestro Blog</a>
            <a href="login.html">Iniciar Sesión</a>
            <a href="registro.html">Regístrate</a>
        </nav>
    </header>

    <main>
        <section class="contenedor-formulario">
            <h2>Bienvenido a Huerto Hogar</h2>
            <form id="formLogin">
                <div class="grupo-input">
                    <label for="correoLogin">Correo Electrónico:</label>
                    <input type="email" id="correoLogin" autocomplete="email" placeholder="ejemplo@duoc.cl" required>
                    <span id="errorCorreoLogin" class ="mensaje-error"></span>
                </div>

                <div class="grupo-input">
                    <label for="passLogin">Contraseña:</label>
                    <input type="password" id="passLogin" autocomplete="current-password" placeholder="Entre 4 y 10 caracteres" required>
                    <span id="errorPassLogin" class ="mensaje-error"></span>
                </div>

                <button type="submit" id="btnLogin" disabled>Ingresar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Huerto Hogar - Conectando familias con el campo chileno de forma sostenible.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
