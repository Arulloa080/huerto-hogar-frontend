<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes de Contacto - HuertoHogar Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block bg-success sidebar collapse" style="min-height: 100vh;">
                <div class="position-sticky pt-3">
                    <h4 class="text-white text-center mb-4">Huerto Hogar Admin</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="admin-home.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="admin-productos.html">Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="admin-usuarios.html">Usuarios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active text-white fw-bold" href="mensajes.html">Mensajes</a>
                        </li>
                        <li class="nav-item mt-4">
                            <a class="nav-link text-danger" href="index.html">Cerrar Sesión</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Bandeja de Entrada</h1>
                    <span class="badge bg-primary rounded-pill">3 nuevos</span>
                </div>

                <section class="table-responsive">
                    <article class="card shadow-sm">
                        <div class="card-body">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Fecha</th>
                                        <th>Remitente</th>
                                        <th>Asunto</th>
                                        <th>Estado</th>
                                        <th class="text-end">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="cuerpoTablaMensajes">
                                    <!-- Los mensajes se cargarán dinámicamente -->
                                </tbody>
                            </table>
                        </div>
                    </article>
                </section>
            </main>
        </div>
    </div>

    <!-- Modal para ver mensaje completo -->
    <div class="modal fade" id="modalMensaje" tabindex="-1" aria-labelledby="modalMensajeLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="modalMensajeLabel">Detalle del Mensaje</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <strong>De:</strong> <span id="verRemitente"></span>
                    </div>
                    <div class="mb-3">
                        <strong>Fecha:</strong> <span id="verFecha"></span>
                    </div>
                    <div class="mb-3">
                        <strong>Asunto:</strong> <span id="verAsunto"></span>
                    </div>
                    <hr>
                    <div>
                        <strong>Mensaje:</strong>
                        <p id="verMensajeTexto" class="mt-2"></p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin-mensajes.js"></script>
</body>
</html>
