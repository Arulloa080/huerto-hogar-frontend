<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuertoHogar - Inicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-green shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 brand-text" href="index.html">
        <img src="img/logo.png" alt="Logo HuertoHogar" class="logo-img">
        <span>HuertoHogar</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="carrito.html">Tienda / Carrito</a></li>
          <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
          <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
        </ul>
        <!-- Acceso directo al Carrito en Navbar -->
        <a href="carrito.html" class="btn btn-yellow position-relative d-flex align-items-center gap-2 font-weight-bold">
          <span>🛒 Carrito</span>
          <span id="cart-count-badge" class="badge bg-danger rounded-pill">0</span>
        </a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <section class="text-center mx-auto max-w-750 mb-5">
      <h1 class="display-4 fw-bold text-dark mb-3">Sabor y frescura <span class="text-emerald">de origen local</span></h1>
      <p class="lead text-secondary mb-4">Productos orgánicos del campo directamente a la puerta de tu hogar.</p>
    </section>

    <!-- Filtros por Categoría -->
    <div class="mb-4 text-center">
      <h5 class="fw-bold mb-3 text-secondary">Categorías</h5>
      <div id="category-filters" class="d-flex flex-wrap justify-content-center"></div>
    </div>

    <!-- Catálogo de Productos Dinámico -->
    <div class="row g-4" id="products-container"></div>
  </main>

  <!-- Acceso directo Flotante (Toast) -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3 z-3">
    <div id="cartToast" class="toast align-items-center text-bg-dark border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body d-flex align-items-center justify-content-between w-100 gap-3">
          <div>
            <span class="fw-bold text-warning d-block">¡Añadido al carrito! 🛒</span>
            <span id="toast-product-name" class="small text-light"></span>
          </div>
          <a href="carrito.html" class="btn btn-yellow btn-sm fw-bold text-nowrap">Ver Carrito →</a>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cart-badge.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
