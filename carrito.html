<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuertoHogar - Carrito de Compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark navbar-green shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 brand-text" href="index.html">
        <img src="img/logo.png" alt="Logo HuertoHogar" class="logo-img">
        <span>HuertoHogar</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" href="carrito.html">Tienda / Carrito</a></li>
          <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
          <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5 flex-grow-1">
    <h1 class="display-6 fw-bold text-emerald mb-4">Carrito de Compras</h1>

    <div class="table-responsive shadow-sm rounded bg-white p-3 mb-4">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Producto</th>
            <th>Precio Unitario</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cart-table-body">
          <!-- Render dinámico desde JS -->
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-between align-items-center bg-white p-3 rounded shadow-sm">
      <button class="btn btn-outline-danger" id="clear-cart-btn">Vaciar Carrito</button>
      <div class="text-end">
        <h4 class="fw-bold text-dark mb-0">Total: <span id="cart-total" class="text-emerald">$0</span></h4>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
