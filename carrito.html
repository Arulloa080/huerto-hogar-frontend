<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuertoHogar - Carrito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark navbar-green sticky-top">
    <div class="container py-1">
      <a class="navbar-brand fs-3 brand-text" href="index.html">HuertoHogar</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center gap-2">
          <li class="nav-item"><a class="nav-link text-white-50 fw-semibold" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link text-white-50 fw-semibold" href="nosotros.html">Nosotros</a></li>
          <li class="nav-item ms-lg-2">
            <a href="carrito.html" class="btn btn-yellow rounded-pill px-4">
              Carrito <span id="cart-count" class="badge badge-origen rounded-circle ms-1">0</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5 flex-grow-1">
    <h2 class="fw-bold mb-4" style="color: var(--green-primary);">Detalle de tu Carrito</h2>

    <div class="row g-4">
      <div class="col-lg-8">
        <div class="product-card p-3 p-md-4">
          <div class="table-responsive">
            <table class="table table-custom align-middle mb-0">
              <thead>
                <tr>
                  <th>Producto</th>
                  <th>Precio</th>
                  <th>Cantidad</th>
                  <th>Subtotal</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody id="tabla-carrito"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="product-card p-4">
          <h4 class="fw-bold mb-3" style="color: var(--green-primary);">Resumen</h4>
          <hr>
          <div class="d-flex justify-content-between align-items-center my-4">
            <span class="text-muted fs-5">Total a Pagar:</span>
            <strong id="total-precio" class="price-text fs-3">$0 CLP</strong>
          </div>
          <button class="btn btn-yellow w-100 py-3 rounded-3 mb-2" onclick="procesarPago()">Pagar Ahora</button>
          <button class="btn btn-outline-danger w-100 py-2 rounded-3" onclick="vaciarCarrito()">Vaciar Carrito</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-white text-center py-4 border-top mt-auto">
    <p class="text-muted small mb-0">&copy; 2026 HuertoHogar. Todos los derechos reservados.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
