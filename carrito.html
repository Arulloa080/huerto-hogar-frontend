<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuertoHogar - Carrito de Compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-green shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 brand-text" href="index.html">
        <img src="img/logo.png" alt="Logo HuertoHogar" class="logo-img">
        <span>HuertoHogar</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" href="carrito.html">Tienda / Carrito</a></li>
          <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
        </ul>
        <div id="user-nav-container" class="d-flex align-items-center gap-2"></div>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h2 class="fw-bold mb-4 text-emerald">Tu Carrito de Compras</h2>

    <div class="row g-4">
      <div class="col-lg-8">
        <div class="table-responsive table-custom shadow-sm">
          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th scope="col">Producto</th>
                <th scope="col">Precio</th>
                <th scope="col">Cantidad</th>
                <th scope="col">Subtotal</th>
                <th scope="col" class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="cart-table-body"></tbody>
          </table>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card summary-card p-4 shadow-sm">
          <h4 class="fw-bold mb-3 border-bottom pb-2">Resumen de Compra</h4>
          
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Subtotal:</span>
            <span id="cart-subtotal" class="fw-semibold">$0</span>
          </div>
          
          <div id="discount-row" class="d-flex justify-content-between mb-2 text-success d-none">
            <span>Descuento Usuario (10%):</span>
            <span id="cart-discount">-$0</span>
          </div>

          <hr>

          <div class="d-flex justify-content-between mb-4">
            <span class="fs-5 fw-bold">Total:</span>
            <span id="cart-total" class="fs-5 price-text">$0</span>
          </div>

          <button id="btn-checkout" class="btn btn-yellow w-100 py-2">Procesar Compra</button>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header navbar-green text-white">
          <h5 class="modal-title brand-text">Iniciar Sesión</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="login-form">
            <div class="mb-3">
              <label for="login-email" class="form-label fw-semibold">Correo Electrónico</label>
              <input type="email" class="form-control form-control-custom" id="login-email" required>
            </div>
            <div class="mb-3">
              <label for="login-password" class="form-label fw-semibold">Contraseña</label>
              <input type="password" class="form-control form-control-custom" id="login-password" required>
            </div>
            <div id="login-error" class="text-danger mb-3 d-none">
              Credenciales inválidas. Verifica tu correo y contraseña.
            </div>
            <button type="submit" class="btn btn-yellow w-100 py-2">Ingresar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
